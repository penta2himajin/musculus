[package]
name = "musculus"
version = "0.1.0"
edition = "2021"
description = "A programmable text-to-speech framework — normalization, synthesis, and audio output as composable adapters"
license = "MIT OR Apache-2.0"
repository = "https://github.com/penta2himajin/musculus"
documentation = "https://docs.rs/musculus"
readme = "README.md"
keywords = ["tts", "speech-synthesis", "voice", "pipeline"]
categories = ["multimedia::audio", "text-processing"]
# Verified by building the library on this toolchain, not inferred.
# 1.80 covers the default build and the onnx frontend's LazyLock usage;
# the `onnx` feature raises the floor further through its dependencies
# (`ort` reports 1.88 itself) and those crates declare that.
rust-version = "1.80"
# Evaluation corpora, model-fetch scripts and design docs are how the
# crate is developed, not how it is consumed. Keeping them out holds
# the published tarball to the code a dependent actually compiles.
exclude = [
    "/.github/",
    "/docs/",
    "/scripts/",
    "/git-hooks/",
]

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed errors. Proc-macro only, and it keeps the per-adapter error
# enums readable instead of hand-rolling Display for each one.
thiserror = "2"

# CLI (opt-in). Used solely by the binary.
clap = { version = "4", features = ["derive", "env"], optional = true }

# ONNX inference (opt-in, M1). rc.13 is stated deliberately: euhadra's
# onnx feature is pinned to the same runtime, and a caret range on a
# pre-release resolves upward anyway (see euhadra's Cargo.toml note).
# Declaring it keeps both crates on one ONNX Runtime in a shared tree.
ort = { version = "2.0.0-rc.13", optional = true }
ndarray = { version = "0.17", optional = true }
tokenizers = { version = "0.21", optional = true }
# .sbv2 bundles are zstd-compressed tars (reference: sbv2file.rs).
zstd = { version = "0.13", optional = true }
tar = { version = "0.4", optional = true }
# Japanese phonemization for the SBV2 frontend. Pinned to 0.12 — the
# exact version sbv2_core is proven against — to avoid API drift while
# we port the g2p algorithm. naist-jdic (BSD) is the license-clean
# dictionary; never enable the AGPL dictionary feature here.
jpreprocess = { version = "0.12", features = ["naist-jdic"], optional = true }
# Symbol-table cleanup patterns for the ja TTS frontend.
regex = { version = "1", optional = true }
# NFKC normalization for the Irodori text frontend; FFT resampling for
# the reference/16 kHz paths (both pure Rust).
unicode-normalization = { version = "0.1", optional = true }
rubato = { version = "0.16", optional = true }

# Speaker playback (opt-in, later milestone).
cpal = { version = "0.15", optional = true }
# WAV writing for the CLI and the evaluation harness. Pure Rust; small
# enough that the CLI can ship it unconditionally.
hound = { version = "3", optional = true }

[features]
# Lean by default: the pipeline runtime plus the rule-based text
# normalization traits, with no ML runtime and no system libraries.
default = []

# Mock adapters for building test doubles against musculus's traits.
# Off by default: they are how musculus is tested, not how it is used.
# Put it under [dev-dependencies] rather than [dependencies].
testing = []

# Everything the `musculus` binary needs. Enable this for
# `cargo install musculus`; a library consumer normally does not.
# WAV writing is part of it because `musculus synth` writes WAVs.
cli = ["dep:clap", "wav"]

onnx = [
    "dep:ort",
    "dep:ndarray",
    "dep:tokenizers",
    "dep:zstd",
    "dep:tar",
    "dep:jpreprocess",
    "dep:regex",
    "dep:unicode-normalization",
    "dep:rubato",
]

# Apple hardware acceleration (CoreML EP) for the ONNX sessions.
# Opt-in: it changes which execution provider ORT prefers, and the
# default build must stay lean and CPU-only.
coreml = ["onnx", "ort/coreml"]

playback = ["dep:cpal"]

# WAV file I/O. Off by default; the `cli` feature implies it.
wav = ["dep:hound"]

[[bin]]
name = "musculus"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
# musculus depends on itself with `testing` on so that integration
# tests get the mocks without every `cargo test` needing an explicit
# --features flag.
musculus = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["full", "test-util"] }
async-trait = "0.1"
# The eval/bench examples parse their arguments with clap, which is an
# optional dependency of the library (see the `cli` feature); examples
# get their own dev-only copy.
clap = { version = "4", features = ["derive", "env"] }
# The round-trip ruler: euhadra's ParakeetAdapter with the SAME ort
# runtime (rc.13) and ndarray (0.17) this crate pins, so the two
# crates share one ONNX Runtime in a dev tree (ADR-0003). The ruler
# model bundle arrives via scripts/setup_ruler_asr.sh.
euhadra = { version = "0.3", features = ["onnx"] }
# 44.1 kHz -> 16 kHz resampling for the ruler (Parakeet expects
# 16 kHz); FFT-based so the aliasing noise does not bias the CER.

[[example]]
name = "bench_sbv2"
required-features = ["onnx", "wav"]

[[example]]
name = "eval_cer"
required-features = ["onnx", "wav"]

[[example]]
name = "irodori_demo"
required-features = ["onnx", "wav"]

[[example]]
name = "prep_ab_audio"
required-features = ["onnx", "wav"]

[[example]]
name = "accent_report"
required-features = ["onnx"]