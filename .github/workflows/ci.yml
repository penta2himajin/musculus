name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # clippy --all-features builds cpal, which links ALSA on Linux
      # (the documented system requirement of the playback feature).
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format check
        run: cargo fmt --all -- --check
      # Explicit feature list rather than --all-features: `coreml` is
      # Apple-only (ORT CoreML EP) and must not be enabled on the Linux
      # runners. Add new cross-platform features here (and check the
      # Apple-only ones locally with the pre-push hook).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features onnx,wav,testing,playback -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The L3 reading gate (tests/l3_ja.rs) is pure text and runs
      # wherever the onnx feature compiles — no model bundle needed.
      - name: Test onnx + wav (L3 gate)
        run: cargo test --features onnx,wav
      # The CLI binary only builds behind the `cli` feature (clap);
      # make sure it keeps compiling.
      - name: Build CLI
        run: cargo build --features cli
      # Lean-by-default guard: the default build must not drag in the
      # ONNX runtime or system libraries (AGENTS.md, Architectural
      # Boundaries). Verified by building once with default features
      # only — every job above already does — and here by checking the
      # onnx feature still compiles.
      - name: Build onnx feature
        run: cargo build --features onnx